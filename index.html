<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tempo · Tu tiempo, con intención</title>
<meta name="theme-color" content="#D9583A">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
:root{
  --bg:#F5F6F8;--surface:#fff;--border:rgba(15,23,32,.09);--text:#1B2128;--muted:#7A828C;--soft:#E9ECEF;
  --accent:#D9583A;--accent-edge:#B5452B;--dark:#20272D;--dark-2:#2A323A;
  --shadow:0 1px 0 rgba(0,0,0,.03),0 8px 24px rgba(15,23,32,.05);
  --r:22px;--ease:cubic-bezier(.2,.8,.2,1);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:1100px;margin:0 auto;padding:0 20px}
header.top{background:var(--surface);border-bottom:1px solid var(--border)}
header.top .wrap{display:flex;align-items:center;justify-content:space-between;height:76px}
.brand{display:flex;align-items:center;gap:0;font-weight:800;font-size:28px;letter-spacing:-.04em}
.brand i{width:42px;height:42px;border-radius:12px;background:var(--accent);display:grid;place-items:center;margin-right:12px}
.brand i svg{width:24px;height:24px;stroke:#fff}
.brand b{color:var(--accent)}
.who{display:flex;align-items:center;gap:14px;color:var(--muted);font-size:14px}
.avatar{width:38px;height:38px;border-radius:50%;background:var(--bg);border:1px solid var(--border);display:grid;place-items:center;font-weight:700;font-size:13px;color:var(--text)}
.hero{padding:34px 0 8px;display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}
h1{margin:8px 0 0;font-size:38px;letter-spacing:-.04em;line-height:1.1}
.today{color:var(--muted);font-size:14px;display:flex;align-items:center;gap:8px}
.tabs{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);margin:22px 0 24px;gap:12px}
.tabs nav{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;-ms-overflow-style:none}
.tabs nav::-webkit-scrollbar{display:none}
.tab{display:flex;align-items:center;gap:8px;padding:14px 10px;color:var(--muted);font-size:15px;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;transition:color .2s}
.tab svg{width:18px;height:18px}
.tab.on{color:var(--accent);border-color:var(--accent)}
.ghost{display:flex;align-items:center;gap:8px;font-weight:700;color:#4B545E;padding:10px 4px;white-space:nowrap}
.ghost svg{width:18px;height:18px}
.grid{display:grid;grid-template-columns:1.55fr 1fr;gap:24px;align-items:start}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:24px}
.cards4{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:24px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow);padding:26px}
.card h3{margin:0;font-size:19px;letter-spacing:-.02em}
.card .sub{color:var(--muted);font-size:14px}
.solo{max-width:640px;margin:0 auto}
.stack{display:flex;flex-direction:column;gap:20px}
/* timer */
.timer{background:radial-gradient(130% 70% at 50% 0%,#36424D 0%,#242C33 48%,#1B2126 100%);color:#fff;border-radius:30px;padding:24px 26px 30px;display:flex;flex-direction:column;align-items:center;min-height:520px;box-shadow:0 18px 50px rgba(15,23,32,.28),inset 0 1px 0 rgba(255,255,255,.06);transition:box-shadow .6s}
.timer.live{box-shadow:0 18px 60px rgba(217,88,58,.28),inset 0 1px 0 rgba(255,255,255,.06)}
.timer .head{width:100%;display:flex;justify-content:space-between;align-items:center}
.timer .lbl{display:flex;align-items:center;gap:10px;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:#C9CFD6}
.timer .lbl:before{content:"";width:16px;height:3px;border-radius:2px;background:var(--accent)}
.chip{border:1px solid rgba(255,255,255,.18);border-radius:999px;padding:7px 14px;font-size:13px;color:#DDE2E7;display:flex;align-items:center;gap:8px}
.chip:before{content:"";width:7px;height:7px;border-radius:50%;background:#7C8791}
.timer.live .chip:before{background:#5BD39B;animation:blink 1.4s infinite}
.timer.paused .chip:before{background:#F0B84A}
.ring{position:relative;width:min(340px,80vw);aspect-ratio:1;margin:18px 0 12px}
.ring:before{content:"";position:absolute;inset:14%;border-radius:50%;background:radial-gradient(circle,rgba(232,116,90,.20) 0%,rgba(232,116,90,0) 70%);opacity:0;transition:opacity .6s}
.timer.live .ring:before{opacity:1;animation:breathe 3.2s ease-in-out infinite}
.ring svg{position:relative;width:100%;height:100%;transform:rotate(-90deg);overflow:visible}
.ring .tr{stroke:rgba(255,255,255,.07)}
.ring .tk{stroke:rgba(255,255,255,.16);stroke-linecap:round;transition:stroke .3s}
.ring .tk.lit{stroke:#E8745A}
.ring .pg{stroke:url(#gr);stroke-linecap:round;transition:stroke-dashoffset .25s linear;filter:drop-shadow(0 0 6px rgba(232,116,90,.55))}
.ring .kn{fill:#fff;filter:drop-shadow(0 0 5px rgba(255,255,255,.7))}
.timer.live .kn{animation:pulse 1.6s ease-in-out infinite;transform-origin:204px 110px}
.ring .in{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.ring .cat{display:flex;align-items:center;gap:8px;font-size:13px;color:#E8EBEE;background:rgba(255,255,255,.08);border-radius:999px;padding:6px 14px;letter-spacing:.02em}
.clock{font-size:78px;font-weight:200;letter-spacing:-.045em;font-variant-numeric:tabular-nums;line-height:1;text-shadow:0 2px 24px rgba(232,116,90,.25)}
.timer .csub{font-size:13px;color:#AEB6BF;min-height:18px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.tname{font-size:20px;font-weight:700;margin-top:6px;text-align:center}
.tsub{color:#AEB6BF;font-size:14px;margin:2px 0 14px}
.tfields{width:100%;max-width:540px;display:flex;flex-direction:column;gap:10px}
.dk{background:transparent;border:1px solid rgba(255,255,255,.16);border-radius:12px;padding:14px 16px;color:#fff;width:100%;outline:none}
.dk::placeholder{color:#8C959F}
.dk:focus{border-color:#E8745A}
select.dk option{color:#111}
.row{display:flex;gap:10px}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;height:54px;border-radius:14px;font-weight:700;padding:0 22px;transition:transform .12s var(--ease),border-bottom-width .12s}
.btn svg{width:20px;height:20px}
.btn.pri{flex:1;background:var(--accent);color:#fff;border-bottom:4px solid var(--accent-edge)}
.btn.pri:active{transform:translateY(3px);border-bottom-width:1px}
.btn.sec{border:1px solid rgba(255,255,255,.2);color:#fff;border-bottom:4px solid rgba(255,255,255,.12)}
.btn.sec:active{transform:translateY(3px);border-bottom-width:1px}
.btn[disabled]{opacity:.45;pointer-events:none}
.foot-note{font-size:13px;color:#98A1AB;text-align:center;margin-top:14px;max-width:420px}
.durs{display:flex;gap:8px;justify-content:center;margin-top:2px}
.durs button{padding:6px 14px;border-radius:999px;border:1px solid rgba(255,255,255,.16);color:#C9CFD6;font-size:13px}
.durs button.on{background:rgba(232,116,90,.18);border-color:#E8745A;color:#fff}
/* stats */
.big{font-size:44px;font-weight:700;letter-spacing:-.04em;line-height:1;margin:26px 0 12px}
.ic{width:26px;height:26px;stroke:var(--accent)}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:14px 10px;border-top:1px solid var(--border);margin-top:18px;padding-top:18px}
.kpis div{display:flex;align-items:center;gap:12px}
.kpis svg{width:18px;height:18px;stroke:var(--muted)}
.kpis b{font-size:22px;display:block;line-height:1.1}.kpis span{font-size:13px;color:var(--muted)}
.pill{background:var(--soft);color:#6A737D;border-radius:10px;padding:8px 14px;font-size:12px;letter-spacing:.14em;font-weight:700;text-transform:uppercase}
.seg{display:flex;background:var(--soft);border-radius:10px;padding:3px}
.seg button{padding:6px 12px;border-radius:8px;font-size:12px;letter-spacing:.1em;font-weight:700;text-transform:uppercase;color:#6A737D}
.seg button.on{background:#fff;color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.chart{position:relative;height:230px;margin-top:20px;display:grid;grid-template-columns:34px 1fr;grid-template-rows:1fr 28px}
.chart .y{display:flex;flex-direction:column;justify-content:space-between;font-size:13px;color:#A0A7AF;padding-bottom:0}
.chart .plot{position:relative;border-bottom:1px solid var(--border);display:flex;align-items:flex-end;justify-content:space-around;gap:6px}
.chart .plot:before{content:"";position:absolute;left:0;right:0;top:0;border-top:1px solid #EEF0F2}
.chart .plot:after{content:"";position:absolute;left:0;right:0;top:50%;border-top:1px solid #EEF0F2}
.bar{position:relative;z-index:1;width:min(36px,10%);background:#E5E8EC;border-radius:8px 8px 0 0;transition:height .5s var(--ease);min-height:0}
.bar.today{background:var(--accent)}
.chart .x{grid-column:2;display:flex;justify-content:space-around;font-size:14px;color:#9AA2AA;align-items:center}
.chart .x .t{color:var(--accent);font-weight:700}
.legend{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.legend i{width:9px;height:9px;border-radius:2px;background:var(--accent);display:inline-block}
.catrow{margin-top:26px}
.catrow .l{display:flex;justify-content:space-between;align-items:baseline}
.catrow .l span:first-child{display:flex;align-items:center;gap:10px}
.catrow .l b{font-weight:600}
.catrow .l em{font-style:normal;color:#9AA2AA;font-size:14px;margin-left:10px}
.track{height:10px;border-radius:99px;background:#EEF0F2;margin-top:14px;overflow:hidden}
.track i{display:block;height:100%;border-radius:99px;transition:width .6s var(--ease)}
/* goals */
.goals{margin-top:26px;display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:26px 40px}
.goal .t{display:flex;justify-content:space-between;font-weight:700}
.goal .t span{color:#9AA2AA;font-weight:500}
.goal .track{height:12px;margin:12px 0 10px}
.goal .n{display:flex;justify-content:space-between;color:#6F7882;font-size:15px}
.goal .n span:last-child{color:#9AA2AA}
.goal.done .t span{color:#2E9D6B;font-weight:700}
.goalsfoot{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;border-top:1px solid var(--border);margin-top:28px;padding-top:20px;color:#6F7882}
.goalsfoot span:last-child{color:#9AA2AA}
.ghead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.ghead .tt{display:flex;gap:16px;align-items:flex-start}
.ghead .tt svg{width:38px;height:38px;stroke:var(--accent);flex:none}
.ghead h3{font-size:22px}
/* sessions */
h2{font-size:22px;margin:34px 0 14px;display:flex;justify-content:space-between;align-items:baseline;letter-spacing:-.02em}
h2 button{font-size:15px;font-weight:700;color:#5F6872}
.list,.slist{display:flex;flex-direction:column;gap:12px}
.list .empty{background:var(--surface);border:1px solid var(--border);border-radius:var(--r)}
.sess{display:grid;grid-template-columns:46px 1fr auto;gap:2px 14px;align-items:center;background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:16px;box-shadow:0 1px 0 rgba(0,0,0,.02),0 6px 18px rgba(15,23,32,.04);position:relative;overflow:hidden}
.sess:before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:4px;border-radius:0 4px 4px 0;background:var(--cc,var(--accent))}
.sess .ico{width:46px;height:46px;border-radius:14px;display:grid;place-items:center}
.sess .ico svg{width:22px;height:22px}
.sess .mid{min-width:0}
.sess .tt{font-weight:700;font-size:16px;letter-spacing:-.01em;line-height:1.25;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.sess .meta{display:flex;align-items:center;flex-wrap:wrap;gap:6px 8px;color:var(--muted);font-size:13px;margin-top:5px}
.cchip{border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700}
.sess .r{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.dur{background:var(--soft);color:#39424B;border-radius:999px;padding:5px 11px;font-size:13px;font-weight:700;white-space:nowrap}
.sess .r button{color:#8B939C;padding:4px;display:grid;place-items:center;border-radius:8px}
.sess .r button:active{background:var(--soft)}
.sess .r button svg{width:17px;height:17px}
.sbot{grid-column:1/-1;margin-top:12px;display:flex;flex-direction:column;gap:10px}
.cdots{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.cdots span{display:flex;gap:4px}.cdots i{width:8px;height:8px;border-radius:50%;background:#E3E6EA}.cdots i.on{background:var(--cc,var(--accent))}
.sess .note{background:#F6F7F9;border-radius:12px;padding:10px 12px;color:#4B545E;font-size:14px;line-height:1.4}
.empty{padding:40px 26px;text-align:center;color:var(--muted)}
.tools{display:flex;gap:12px;margin:20px 0 6px;flex-wrap:wrap}
.search{flex:1;min-width:200px;display:flex;align-items:center;gap:12px;border:1px solid var(--border);border-radius:14px;padding:0 16px;height:52px;background:#fff}
.search svg{width:18px;height:18px;stroke:#99A1AA}
.search input{border:0;outline:0;flex:1;background:none;height:100%}
.sel{border:1px solid var(--border);border-radius:14px;height:52px;padding:0 14px;background:#fff}
.tip{background:#E9ECF0;border-radius:var(--r);padding:22px 24px;display:flex;gap:14px}
.tip svg{width:22px;height:22px;stroke:#5A646E;flex:none;margin-top:2px}
.tip b{display:block;margin-bottom:6px}
.tip p{margin:0;color:#6A737D}
footer{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;border-top:1px solid var(--border);margin:36px 0 50px;padding-top:20px;font-size:13px;color:#98A0A9}
footer .acts{display:flex;gap:16px}footer button{color:#6A737D;text-decoration:underline;font-size:13px}
/* modal */
.ov{position:fixed;inset:0;background:rgba(15,23,32,.5);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20;animation:fade .18s}
.modal{background:#fff;border-radius:24px;width:min(560px,100%);max-height:94vh;overflow:auto;padding:28px;box-shadow:0 30px 80px rgba(0,0,0,.3);animation:pop .22s var(--ease)}
.modal h3{margin:0 0 6px;font-size:22px}
.modal .x{float:right;color:#555;font-size:22px;line-height:1;padding:4px 8px}
.modal label{display:block;margin:18px 0 8px;color:#4B545E;font-size:15px}
.modal .in{width:100%;border:1px solid var(--border);border-radius:12px;padding:14px 16px;background:#fff;outline:none}
.modal .in:focus{border-color:var(--accent)}
.modal .two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.mfoot{display:flex;gap:10px;margin-top:22px}
.mfoot .btn.pri{height:54px}
.danger{color:#C2392B;font-weight:700;padding:0 14px}
.conc-opts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.conc-opts label{margin:0;display:flex;align-items:center;gap:8px;border:1px solid var(--border);border-radius:10px;padding:10px 14px;cursor:pointer;color:var(--text)}
.conc-opts input{accent-color:var(--accent)}
.conc-opts label:has(input:checked){border-color:var(--accent);background:#FDF1ED;color:var(--accent)}
.hint2{font-size:13px;color:var(--muted);margin-top:8px}
.goalrow{display:grid;grid-template-columns:1fr 100px 70px;align-items:center;gap:10px;margin-top:10px}
.rtf{display:block;width:100%;border:0;border-radius:var(--r);background:#C5CCC0}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#1B2128;color:#fff;padding:12px 18px;border-radius:12px;font-size:14px;z-index:30;animation:pop .2s var(--ease)}
.sumhead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.delta{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:6px 12px;font-size:13px;font-weight:700}
.delta.up{background:#E6F4EF;color:#2E7D5B}.delta.down{background:#FCEBE6;color:#B5452B}.delta.eq{background:var(--soft);color:#6A737D}
.sumtxt{font-size:17px;margin:18px 0 0;color:#2F373F}
.sumshare{margin-top:18px;display:flex;gap:10px}
.sumshare .btn{height:46px;background:var(--accent);color:#fff;border-bottom:4px solid var(--accent-edge)}
.chips{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:20px}
.chip2{display:flex;align-items:center;gap:12px;background:var(--bg);border-radius:16px;padding:14px 16px}
.chip2 svg{width:22px;height:22px;stroke:var(--accent);flex:none}
.chip2 span{display:block;font-size:12px;color:var(--muted)}.chip2 b{font-size:16px}
.pair{flex:1;display:flex;align-items:flex-end;justify-content:center;gap:3px;height:100%}
.pair .bar{width:36%;max-width:18px}.bar.prev{background:#D5DAE0}.bar.cur{background:#F0A090}
.legend2{display:flex;gap:18px;margin-top:10px;font-size:13px;color:var(--muted)}.legend2 i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:6px}
.donut{display:flex;align-items:center;gap:26px;margin-top:20px;flex-wrap:wrap}
.dring{position:relative;width:170px;height:170px;flex:none}.dring svg{width:100%;height:100%}
.dc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}.dc b{font-size:20px}.dc span{font-size:12px;color:var(--muted)}
.dleg{flex:1;min-width:150px;display:flex;flex-direction:column;gap:10px}
.dleg div{display:flex;align-items:center;gap:10px}.dleg span{flex:1}.dleg b{font-weight:700}
.tbl{width:100%;border-collapse:collapse;margin-top:14px;font-size:15px}
.tbl th{text-align:left;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:10px 8px;border-bottom:1px solid var(--border)}
.tbl td{padding:14px 8px;border-bottom:1px solid var(--border)}.tbl tr:last-child td{border:0}
.tbl .n{white-space:nowrap}.tbl td.up{color:#2E7D5B;font-weight:700}.tbl td.down{color:#B5452B;font-weight:700}
.tbl .pc{min-width:110px}.tbl .pc .track.mini{height:8px;margin:0 0 4px}.tbl .pc span{font-size:13px;color:var(--muted)}.tbl .pc span.ok{color:#2E9D6B;font-weight:700}
@media(max-width:380px){.tab{font-size:11px}.sess{padding:14px;gap:2px 12px}}
@media(max-width:860px){.chips{grid-template-columns:1fr 1fr}.tbl{font-size:13px}.tbl th,.tbl td{padding:10px 4px}.tbl th:nth-child(3),.tbl td:nth-child(3){display:none}.dring{width:150px;height:150px}}
.timer.brk .pg{stroke:url(#gb);filter:drop-shadow(0 0 6px rgba(76,201,160,.55))}
.timer.brk .tk.lit{stroke:#4CC9A0}
.timer.brk.live{box-shadow:0 18px 60px rgba(76,201,160,.25),inset 0 1px 0 rgba(255,255,255,.06)}
.timer.brk .ring:before{background:radial-gradient(circle,rgba(76,201,160,.20) 0%,rgba(76,201,160,0) 70%)}
.timer.brk .lbl:before{background:#4CC9A0}
.timer.brk .btn.pri{background:#2FA87F;border-bottom-color:#228763}
.btn.brkbtn{width:100%;background:rgba(76,201,160,.14);border:1px solid rgba(76,201,160,.5);color:#8FE3C5;border-bottom:4px solid rgba(76,201,160,.3);margin-bottom:12px}
.bhint{font-size:13px;color:#98A1AB;text-align:center;margin:-2px 0 10px}
@keyframes blink{50%{opacity:.35}}@keyframes breathe{50%{transform:scale(1.08);opacity:.6}}@keyframes pulse{50%{transform:scale(1.5)}}
@keyframes fade{from{opacity:0}}@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.98)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

<script src="projects.js"></script>
<script>
'use strict';
const CATS=[
 {id:'aleman',name:'Alemán',color:'#D4583A',bg:'#FCEBE6'},
 {id:'lectura',name:'Lectura',color:'#3F8F76',bg:'#E6F4EF'},
 {id:'medicina',name:'Medicina',color:'#4A78C2',bg:'#E7EEF9'},
 {id:'programacion',name:'Programación',color:'#8A63C9',bg:'#F0EAFA'},
 {id:'proyectos',name:'Proyectos',color:'#2E8B8B',bg:'#E3F3F3'},
 {id:'otros',name:'Otros',color:'#7C838C',bg:'#EEF0F2'}
];
const cat=id=>CATS.find(c=>c.id===id)||CATS[5];
const DEF_GOALS={aleman:600,lectura:210,medicina:180,programacion:240,proyectos:1020};
const SEED=[
 {id:'s1',title:'Anki - Cards',cat:'aleman',min:25,start:'2026-09-29T16:03:00',conc:3,note:'Avancé FSP Deck y repasé B1 Deck'},
 {id:'s2',title:'The Brothers Karamazov',cat:'lectura',min:25,start:'2026-09-29T17:14:00',conc:3,note:'Difícil seguir porque estaba haciendo a la misma vez el proyecto de Dmitri con ChatGPT-6.1 Sol'},
 {id:'s3',title:'FSP',cat:'aleman',min:25,start:'2026-10-05T12:00:00',conc:3,note:'Decir en voz alta todo el FSP- Anamnese hasta l aparte'}
];
const KEY='tempo.v3';
let S=load();S.prefs=Object.assign({notify:false,autoBreak:true},S.prefs);save();
/* Trabajo pasó a ser Proyectos. Las sesiones con título de proyecto o con proj pasan a Proyectos y quedan ligadas al proyecto. */
function migrate(r){
  let ch=false;
  (r.sessions||[]).forEach(x=>{
    if(x.cat==='trabajo'||(x.cat==='programacion'&&x.proj)){x.cat='proyectos';ch=true}
    if(x.cat==='proyectos'&&!x.proj){
      const t=String(x.title||'').toLowerCase().trim();
      const m=RT_PROJECTS.find(p=>t&&(t===p.name.toLowerCase()||t.includes(p.name.toLowerCase().replace(/ \(.*\)$/,''))));
      if(m){x.proj=m.id;ch=true}
    }
  });
  (r.sessions||[]).forEach(x=>{
    if(/ashen\s*vow/i.test(x.title||'')){x.title='Marchward';if(!x.proj)x.proj='ash';if(x.cat!=='proyectos')x.cat='proyectos';ch=true}
  });
  if(r.goals&&'trabajo' in r.goals){r.goals.proyectos=r.goals.trabajo===300?1020:r.goals.trabajo;delete r.goals.trabajo;ch=true}
  if(r.timer&&r.timer.cat==='trabajo'){r.timer.cat='proyectos';ch=true}
  return ch;
}
function load(){
  try{const r=JSON.parse(localStorage.getItem(KEY));if(r&&Array.isArray(r.sessions)){migrate(r);return Object.assign({goals:{...DEF_GOALS},timer:idle()},r)}}catch(e){}
  return {sessions:SEED.map(x=>({...x})),goals:{...DEF_GOALS},timer:idle()};
}
function idle(){return {status:'idle',mode:'focus',pendingBreak:0,dur:1500,remaining:1500,endAt:0,title:'',cat:'aleman',proj:'',note:''}}
const PJ=Object.fromEntries(RT_PROJECTS.map(p=>[p.id,p]));
const todayIdx=()=>(new Date().getDay()+6)%7;
function rtDay(id){try{const r=JSON.parse(localStorage.getItem('ritmo.v1'));if(r&&r.sched&&id in r.sched)return r.sched[id]}catch(e){}return PJ[id].day}
function rtTodayId(){const d=todayIdx();return (RT_PROJECTS.find(p=>rtDay(p.id)===d)||RT_PROJECTS[0]).id}
function projSelect(id,sel,cls){const d=todayIdx();return `<select id="${id}" class="${cls}" aria-label="Proyecto">${[...RT_PROJECTS].sort((a,b)=>(rtDay(a.id)===d?0:1)-(rtDay(b.id)===d?0:1)).map(p=>`<option value="${p.id}" ${p.id===sel?'selected':''}>${rtDay(p.id)===d?'Hoy · ':''}${esc(p.name)}</option>`).join('')}</select>`}
const BREAKS={15:3,25:5,45:10,60:15};
const breakMin=sec=>BREAKS[Math.round(sec/60)]||Math.max(1,Math.round(sec/60/5));
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const dkey=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const pd=s=>new Date(s);
function fmt(m){m=Math.round(m);if(m<=0)return'0 min';const h=Math.floor(m/60),r=m%60;return h?(r?`${h} h ${r} min`:`${h} h`):`${m} min`}
function weekStart(d=new Date()){const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()-((x.getDay()+6)%7));return x}
const sorted=()=>[...S.sessions].sort((a,b)=>pd(b.start)-pd(a.start));
const total=l=>l.reduce((a,s)=>a+s.min,0);
function inWeek(s){const w=weekStart(),e=new Date(w);e.setDate(e.getDate()+7);const d=pd(s.start);return d>=w&&d<e}
function streak(){
  const days=new Set(S.sessions.map(s=>dkey(pd(s.start))));
  let d=new Date();if(!days.has(dkey(d)))d.setDate(d.getDate()-1);
  let n=0;while(days.has(dkey(d))){n++;d.setDate(d.getDate()-1)}return n;
}
const MES=['ene','feb','mar','abr','may','jun','jul','ago','sept','oct','nov','dic'];
const dateStr=s=>{const d=pd(s);return `${d.getDate()} ${MES[d.getMonth()]} · ${d.toLocaleTimeString('es-DO',{hour:'numeric',minute:'2-digit'})}`};
const rangeWeek=()=>{const a=weekStart(),b=new Date(a);b.setDate(b.getDate()+6);return `${a.getDate()} ${MES[a.getMonth()]} — ${b.getDate()} ${MES[b.getMonth()]}`};
const I={
 clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
 check:'<path d="M5 12.5l4.5 4.5L19 7.5"/>',
 flame:'<path d="M12 3c1 3.5 5 5.5 5 10a5 5 0 0 1-10 0c0-2 1-3 2-4 .3 1.5 1 2 2 2-.5-3 0-6 1-8z"/>',
 brain:'<path d="M9 4a3 3 0 0 0-3 3 3 3 0 0 0-2 5 3 3 0 0 0 2 5 3 3 0 0 0 6 1V5a2 2 0 0 0-3-1zM15 4a3 3 0 0 1 3 3 3 3 0 0 1 2 5 3 3 0 0 1-2 5 3 3 0 0 1-6 1"/>',
 target:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.2"/>',
 pen:'<path d="M4 20l1-4L16 5l3 3L8 19z"/>',
 play:'<path d="M7 5l12 7-12 7z" fill="currentColor"/>',
 pause:'<path d="M8 5v14M16 5v14" stroke-width="3"/>',
 book:'<path d="M3 5.5C5 4 8 4 12 6c4-2 7-2 9-.5V19c-2-1.500-5-1.500-9 .5-4-2-7-2-9-.5z"/><path d="M12 6v13.500"/>',
 hist:'<path d="M4 12a8 8 0 1 0 3-6.200M4 4v4h4M12 8v4l3 2"/>',
 bars:'<path d="M5 20V10M10 20V4M15 20v-8M20 20V8"/>',
 plus:'<path d="M12 5v14M5 12h14"/>',
 search:'<circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/>',
 spark:'<path d="M12 3v4M12 17v4M3 12h4M17 12h4M6 6l2.500 2.500M15.500 15.500L18 18M18 6l-2.500 2.500M8.500 15.500L6 18"/>'
};
const svg=(n,extra='')=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" ${extra}>${I[n]}</svg>`;
function toast(t){const e=document.createElement('div');e.className='toast';e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),2400)}

/* ---------- state / tabs ---------- */
let tab='enfoque',fCat='',fText='',statMode='total';
const TABS=[['enfoque','Enfoque','clock'],['historial','Historial','hist'],['stats','Estadísticas','bars'],['resumen','Resumen','spark'],['ritmo','Ritmo','target']];
function renderChrome(){
  $('#tabs').innerHTML=TABS.map(([id,l,ic])=>`<button class="tab ${tab===id?'on':''}" data-tab="${id}">${svg(ic)}${l}</button>`).join('');
  $('#addBtn').innerHTML=svg('plus')+'Añadir sesión';
  const t=new Date().toLocaleDateString('es-DO',{weekday:'long',day:'numeric',month:'long'});
  $('#todayLabel').innerHTML=svg('spark','width="18" height="18"')+esc(t.charAt(0).toUpperCase()+t.slice(1));
}
$('#tabs').addEventListener('click',e=>{const b=e.target.closest('[data-tab]');if(b){tab=b.dataset.tab;render()}});
$('#addBtn').addEventListener('click',()=>openSession(null));

/* ---------- views ---------- */
function weekChart(){
  const w=weekStart(),mins=[0,0,0,0,0,0,0];
  S.sessions.filter(inWeek).forEach(s=>{mins[(pd(s.start).getDay()+6)%7]+=s.min});
  const max=Math.max(60,...mins),td=(new Date().getDay()+6)%7,L=['L','M','M','J','V','S','D'];
  return `<div class="chart"><div class="y"><span>${max>=60?Math.round(max/60*10)/10+' h':max+' min'}</span><span style="opacity:0">.</span><span>0</span></div>
  <div class="plot">${mins.map((m,i)=>`<div class="bar ${i===td?'today':''}" style="height:${m/max*100}%" title="${fmt(m)}"></div>`).join('')}</div>
  <div class="x">${L.map((l,i)=>`<span class="${i===td?'t':''}">${l}</span>`).join('')}</div></div>`;
}
function catBars(list){
  const t=total(list);
  const rows=CATS.map(c=>({c,m:total(list.filter(s=>s.cat===c.id))})).filter(r=>r.m>0).sort((a,b)=>b.m-a.m);
  if(!rows.length)return '<div class="empty">Aún no hay tiempo registrado.</div>';
  return rows.map(({c,m})=>{const p=Math.round(m/t*100);return `<div class="catrow"><div class="l"><span><i class="dot" style="background:${c.color}"></i><b>${c.name}</b></span><span><b>${fmt(m)}</b><em>${p}%</em></span></div><div class="track"><i style="width:${p}%;background:${c.color}"></i></div></div>`}).join('');
}
function goalsCard(){
  const wk=S.sessions.filter(inWeek);
  const ids=Object.keys(S.goals).filter(k=>S.goals[k]>0);
  let done=0;
  const rows=ids.map(id=>{
    const c=cat(id),m=total(wk.filter(s=>s.cat===id)),g=S.goals[id],p=Math.min(100,Math.round(m/g*100));if(m>=g)done++;
    return `<div class="goal ${m>=g?'done':''}"><div class="t">${c.name}<span>${m>=g?'✓ Cumplida':p+'%'}</span></div><div class="track"><i style="width:${p}%;background:${c.color}"></i></div><div class="n"><span>${fmt(m)}</span><span>de ${fmt(g)}</span></div></div>`}).join('');
  return `<div class="card"><div class="ghead"><div class="tt">${svg('target')}<div><h3>Metas de la semana</h3><div class="sub">${rangeWeek()} · Lun a dom</div></div></div><button class="ghost" data-act="goals">${svg('pen')}Ajustar metas</button></div>
  <div class="goals">${rows||'<div class="empty">Sin metas. Ajusta tus metas para empezar.</div>'}</div>
  <div class="goalsfoot"><span>${done} de ${ids.length} metas cumplidas</span><span>Las metas se renuevan cada lunes.</span></div></div>`;
}
function sessRow(s,edit=true){
  const c=cat(s.cat);
  const dots=s.conc?`<div class="cdots">${svg('brain','width="15" height="15"')}<span>${[1,2,3,4,5].map(n=>`<i class="${n<=s.conc?'on':''}"></i>`).join('')}</span>Concentración ${s.conc}/5</div>`:'';
  return `<div class="sess" style="--cc:${c.color}"><div class="ico" style="background:${c.bg};color:${c.color}">${svg('book')}</div>
  <div class="mid"><div class="tt">${esc(s.title||c.name)}</div><div class="meta"><span class="cchip" style="background:${c.bg};color:${c.color}">${c.name}</span>${s.proj&&PJ[s.proj]?`<span class="cchip" style="background:var(--soft);color:#4B545E">${esc(PJ[s.proj].name)}</span>`:''}<span>${dateStr(s.start)}</span></div></div>
  <div class="r"><span class="dur">${s.min} min</span>${edit?`<button data-edit="${s.id}" aria-label="Editar">${svg('pen')}</button>`:''}</div>
  ${dots||s.note?`<div class="sbot">${dots}${s.note?`<div class="note">${esc(s.note)}</div>`:''}</div>`:''}</div>`;
}
function dayCard(){
  const td=S.sessions.filter(s=>dkey(pd(s.start))===dkey(new Date()));
  return `<div class="card"><div style="display:flex;justify-content:space-between;align-items:center"><h3>Tu día, hasta ahora</h3><span class="pill">Hoy</span></div>
    <div class="big">${fmt(total(td))}</div><div class="sub">de enfoque registrado</div>
    <div class="kpis"><div>${svg('check')}<div><b>${td.length}</b><span>sesiones</span></div></div><div>${svg('flame')}<div><b>${streak()}</b><span>días seguidos</span></div></div></div></div>`;
}
function weekCard(){
  return `<div class="card"><div style="display:flex;justify-content:space-between;align-items:center"><h3>Esta semana</h3><span class="legend"><i></i>Enfoque</span></div>${weekChart()}
    <div style="display:flex;justify-content:space-between;color:var(--muted);font-size:13px;margin-top:10px"><span>Un día a la vez.</span><span>Lun — Dom</span></div></div>`;
}
function vEnfoque(){
  const t=S.timer,brk=t.mode==='break';
  const running=t.status!=='idle',c=cat(t.cat);
  const bm=breakMin(t.dur);
  return `<div class="solo"><section class="timer ${brk?'brk':''} ${t.status==='running'?'live':t.status==='paused'?'paused':''}">
    <div class="head"><span class="lbl">${brk?'Tiempo de pausa':'Tiempo de enfoque'}</span><span class="chip" id="stChip">${t.status==='running'?'En curso':t.status==='paused'?'En pausa':'Listo'}</span></div>
    <div class="ring"><svg viewBox="0 0 220 220"><defs><linearGradient id="gr" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F7B09C"/><stop offset=".55" stop-color="#E8745A"/><stop offset="1" stop-color="#D9583A"/></linearGradient><linearGradient id="gb" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9BEBD0"/><stop offset=".55" stop-color="#4CC9A0"/><stop offset="1" stop-color="#2FA87F"/></linearGradient></defs>
      <g id="tks">${Array.from({length:60},(_,i)=>{const a=i*6*Math.PI/180,L=i%5===0,r1=L?101:103,r2=L?109:107;return `<line class="tk" x1="${(110+r1*Math.cos(a)).toFixed(2)}" y1="${(110+r1*Math.sin(a)).toFixed(2)}" x2="${(110+r2*Math.cos(a)).toFixed(2)}" y2="${(110+r2*Math.sin(a)).toFixed(2)}" stroke-width="${L?2.4:1.4}"/>`}).join('')}</g>
      <circle class="tr" cx="110" cy="110" r="94" fill="none" stroke-width="5"/><circle class="pg" id="pg" cx="110" cy="110" r="94" fill="none" stroke-width="5" stroke-dasharray="590.62" stroke-dashoffset="0"/>
      <g id="kn"><circle class="kn" cx="204" cy="110" r="4.5"/></g></svg>
      <div class="in"><div class="cat"><i class="dot" style="background:${brk?'#4CC9A0':'#E8745A'}"></i><span id="catLbl">${brk?'Pausa':c.name}</span></div><div class="clock" id="clock">25:00</div><div class="csub" id="csub"></div></div></div>
    ${brk?`<div class="tname">Descansa</div><div class="tsub">Respira, estírate y toma agua</div>`
      :running?`<div class="tname">${esc(t.title||c.name)}</div><div class="tsub">Sesión de ${Math.round(t.dur/60)} minutos</div>`
      :`${t.pendingBreak?`<button class="btn brkbtn" data-act="startbreak">${svg('clock')}Empezar pausa de ${t.pendingBreak} min</button>`:''}<div class="durs">${[15,25,45,60].map(m=>`<button data-dur="${m}" class="${t.dur===m*60?'on':''}">${m} min</button>`).join('')}</div><div class="bhint" style="margin-top:10px">Pausa al terminar: ${bm} min · ${S.prefs.autoBreak?'automática':'manual'}</div>`}
    <div class="tfields">
      ${running||brk?'':`<input class="dk" id="tTitle" placeholder="¿En qué vas a trabajar?" value="${esc(t.title)}" maxlength="80">
      <select class="dk" id="tCat">${CATS.map(x=>`<option value="${x.id}" ${x.id===t.cat?'selected':''}>${x.name}</option>`).join('')}</select>
      ${t.cat==='proyectos'?projSelect('tProj',t.proj||rtTodayId(),'dk'):''}`}
      ${brk?'':`<input class="dk" id="tNote" placeholder="Una nota sobre tu avance (opcional)" value="${esc(t.note)}" maxlength="300">`}
      <div class="row">
        <button class="btn pri" data-act="toggle">${svg(t.status==='running'?'pause':'play')}${t.status==='running'?'Pausar':t.status==='paused'?'Reanudar':'Empezar'}</button>
        ${brk?`<button class="btn sec" data-act="skip">${svg('check')}Saltar pausa</button>`:`<button class="btn sec" data-act="finish" ${running?'':'disabled'}>${svg('check')}Guardar</button>`}
      </div>
    </div>
  </section></div>`;
}
let rtH=1500;
function vRitmo(){return `<iframe id="rtf" class="rtf" src="ritmo.html" title="Ritmo semanal" style="height:${rtH}px"></iframe>`}
window.addEventListener('message',e=>{
  const f=$('#rtf');if(!f||e.source!==f.contentWindow||!e.data||!e.data.tempo)return;
  if(e.data.tempo==='height'){rtH=Math.ceil(e.data.h);f.style.height=rtH+'px'}
  else if(e.data.tempo==='tab'){tab=e.data.tab;render();window.scrollTo(0,0)}
});
function vHistorial(){
  const q=fText.toLowerCase();
  const l=sorted().filter(s=>(!fCat||s.cat===fCat)&&(!q||(s.title+' '+s.note).toLowerCase().includes(q)));
  return `<div class="grid2" style="margin-bottom:24px">${dayCard()}${weekCard()}</div>
  <div class="card"><h3>Tu historial de enfoque</h3><div class="sub" style="margin-top:6px">${l.length} ${l.length===1?'sesión':'sesiones'} · ${fmt(total(l))} en total</div>
  <div class="tools"><label class="search">${svg('search')}<input id="fText" placeholder="Buscar tarea o nota" value="${esc(fText)}"></label>
  <select class="sel" id="fCat"><option value="">Todas las categorías</option>${CATS.map(c=>`<option value="${c.id}" ${fCat===c.id?'selected':''}>${c.name}</option>`).join('')}</select></div>
  <div class="slist" style="margin-top:14px">${l.map(s=>sessRow(s)).join('')||'<div class="empty">Nada que coincida.</div>'}</div></div>`;
}
function rtWeekData(){
  let r={};try{r=JSON.parse(localStorage.getItem('ritmo.v1'))||{}}catch(e){}
  const caps=(Array.isArray(r.caps)&&r.caps.length===7?r.caps:[3,3,3,3,3,2,0]).map(h=>(+h||0)*60);
  const log=r.log||{},life=r.life||{},ws=weekStart();
  const days=[...Array(7)].map((_,i)=>{const d=new Date(ws);d.setDate(d.getDate()+i);return dkey(d)});
  const proj=Object.fromEntries(RT_PROJECTS.map(p=>[p.id,0]));
  days.forEach(k=>Object.entries(log[k]||{}).forEach(([id,m])=>{if(id in proj)proj[id]+=m}));
  S.sessions.filter(inWeek).forEach(s=>{if(s.proj&&s.proj in proj)proj[s.proj]+=s.min});
  const auto=(k,id)=>S.sessions.some(s=>dkey(pd(s.start))===k&&(id==='leer'?s.cat==='lectura':id==='estudiar'?(s.cat==='aleman'||s.cat==='medicina'):false));
  const lifeN=id=>days.filter(k=>(life[k]||{})[id]||auto(k,id)).length;
  return {budget:caps.reduce((a,b)=>a+b,0),code:Object.values(proj).reduce((a,b)=>a+b,0),proj,lifeN};
}
function codeCard(){
  const w=rtWeekData(),pct=w.budget?Math.round(w.code/w.budget*100):0,col=cat('proyectos').color;

function rangeSessions(off){
  const a=weekStart();a.setDate(a.getDate()+7*off);const b=new Date(a);b.setDate(b.getDate()+7);
  return S.sessions.filter(s=>{const d=pd(s.start);return d>=a&&d<b});
}
const DIAS=['lunes','martes','miércoles','jueves','viernes','sábado','domingo'];
function summaryData(){
  const wk=rangeSessions(0),pw=rangeSessions(-1),t=total(wk),p=total(pw);
  const byDay=[0,0,0,0,0,0,0];wk.forEach(s=>{byDay[(pd(s.start).getDay()+6)%7]+=s.min});
  const bi=byDay.indexOf(Math.max(...byDay));
  const cats=CATS.map(c=>({c,m:total(wk.filter(s=>s.cat===c.id))})).filter(r=>r.m>0).sort((a,b)=>b.m-a.m);
  const ids=Object.keys(S.goals).filter(k=>S.goals[k]>0);
  const met=ids.filter(id=>total(wk.filter(s=>s.cat===id))>=S.goals[id]);
  const missing=ids.filter(id=>!met.includes(id)).map(id=>({id,left:S.goals[id]-total(wk.filter(s=>s.cat===id))})).sort((a,b)=>a.left-b.left);
  const cs=wk.filter(s=>s.conc),avg=cs.length?cs.reduce((a,s)=>a+s.conc,0)/cs.length:0;
  const days=new Set(wk.map(s=>dkey(pd(s.start)))).size;
  return {wk,t,p,delta:p?Math.round((t-p)/p*100):null,bestDay:t?DIAS[bi]:null,bestMin:byDay[bi],top:cats[0],ids,met,missing,avg,days};
}
function summaryText(d){
  if(!d.t)return 'Esta semana aún no hay sesiones registradas.';
  let x=`Esta semana: ${fmt(d.t)} en ${d.wk.length} ${d.wk.length===1?'sesión':'sesiones'}, ${d.days} ${d.days===1?'día activo':'días activos'}. `;
  if(d.top)x+=`Lo que más trabajaste: ${d.top.c.name} (${fmt(d.top.m)}). `;
  x+=`Mejor día: ${d.bestDay} (${fmt(d.bestMin)}). `;
  if(d.ids.length)x+=`Metas cumplidas: ${d.met.length} de ${d.ids.length}. `;
  if(d.missing[0])x+=`La más cercana: ${cat(d.missing[0].id).name}, te faltan ${fmt(d.missing[0].left)}. `;
  if(d.avg)x+=`Concentración media: ${d.avg.toFixed(1)}/5. `;
  return x.trim();
}
function dayMins(list){const m=[0,0,0,0,0,0,0];list.forEach(s=>{m[(pd(s.start).getDay()+6)%7]+=s.min});return m}
function cmpChart(){
  const a=dayMins(rangeSessions(0)),b=dayMins(rangeSessions(-1)),max=Math.max(60,...a,...b),td=(new Date().getDay()+6)%7,L=['L','M','M','J','V','S','D'];
  return `<div class="chart"><div class="y"><span>${Math.round(max/60*10)/10} h</span><span style="opacity:0">.</span><span>0</span></div>
  <div class="plot" style="gap:0">${a.map((m,i)=>`<div class="pair"><div class="bar prev" style="height:${b[i]/max*100}%" title="Semana pasada: ${fmt(b[i])}"></div><div class="bar ${i===td?'today':'cur'}" style="height:${m/max*100}%" title="Esta semana: ${fmt(m)}"></div></div>`).join('')}</div>
  <div class="x">${L.map((l,i)=>`<span class="${i===td?'t':''}">${l}</span>`).join('')}</div></div>
  <div class="legend2"><span><i style="background:#D5DAE0"></i>Semana pasada</span><span><i style="background:var(--accent)"></i>Esta semana</span></div>`;
}
function donut(list){
  const t=total(list),rows=CATS.map(c=>({c,m:total(list.filter(s=>s.cat===c.id))})).filter(r=>r.m>0).sort((a,b)=>b.m-a.m);
  if(!t)return '<div class="empty">Sin sesiones esta semana.</div>';
  let off=25;
  const arcs=rows.map(({c,m})=>{const p=m/t*100,e=`<circle cx="21" cy="21" r="15.9155" fill="none" stroke="${c.color}" stroke-width="5.5" stroke-dasharray="${p} ${100-p}" stroke-dashoffset="${off}"/>`;off-=p;return e}).join('');
  return `<div class="donut"><div class="dring"><svg viewBox="0 0 42 42"><circle cx="21" cy="21" r="15.9155" fill="none" stroke="#EEF0F2" stroke-width="5.5"/>${arcs}</svg><div class="dc"><b>${fmt(t)}</b><span>esta semana</span></div></div>
  <div class="dleg">${rows.map(({c,m})=>`<div><i class="dot" style="background:${c.color}"></i><span>${c.name}</span><b>${Math.round(m/t*100)}%</b></div>`).join('')}</div></div>`;
}
function goalTable(d){
  const pw=rangeSessions(-1);
  const ids=[...new Set([...Object.keys(S.goals).filter(k=>S.goals[k]>0),...d.wk.map(s=>s.cat)])];
  const rows=ids.map(id=>{
    const c=cat(id),m=total(d.wk.filter(s=>s.cat===id)),pm=total(pw.filter(s=>s.cat===id)),g=S.goals[id]||0,p=g?Math.min(100,Math.round(m/g*100)):0,df=m-pm;
    return `<tr><td><i class="dot" style="background:${c.color}"></i> ${c.name}</td><td class="n">${fmt(m)}</td><td class="n">${g?fmt(g):'—'}</td>
    <td class="pc">${g?`<div class="track mini"><i style="width:${p}%;background:${c.color}"></i></div><span class="${m>=g?'ok':''}">${m>=g?'✓':p+'%'}</span>`:'—'}</td>
    <td class="n ${df>0?'up':df<0?'down':''}">${df>0?'+':df<0?'−':''}${df?fmt(Math.abs(df)):'='}</td></tr>`}).join('');
  return `<table class="tbl"><thead><tr><th>Categoría</th><th>Hecho</th><th>Meta</th><th>Avance</th><th>vs ant.</th></tr></thead><tbody>${rows}</tbody></table>`;
}

function copyText(x){

    manual();
  };
  const manual=()=>{const m=modal(`<button class="x" id="mx" aria-label="Cerrar">×</button><h3>Resumen</h3><div class="sub">Mantén pulsado para copiar.</div><textarea class="in" id="sumTa" rows="6" readonly style="margin-top:14px">${esc(x)}</textarea>`);$('#mx').onclick=closeModal;const t=$('#sumTa');t.focus();t.select()};

function ntfLabel(){const b=$('#ntf');if(b)b.textContent='Avisos: '+(S.prefs.notify&&'Notification' in window&&Notification.permission==='granted'?'sí':'no')}
let AC;
function ac(){try{if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();return AC}catch(e){return null}}
function chime(kind){
  const a=ac();if(!a)return;
  const seqs={focus:[[523.25,0],[659.25,.17],[783.99,.34],[1046.5,.55]],rest:[[783.99,0],[1046.5,.22]]};
  const reps=kind==='focus'?2:1,t0=a.currentTime+.05;
  for(let r=0;r<reps;r++)seqs[kind].forEach(([f,d])=>{
    [[f,'sine',.22],[f*2,'triangle',.05]].forEach(([fq,ty,vol])=>{
      const o=a.createOscillator(),g=a.createGain(),st=t0+r*1.6+d;
      o.type=ty;o.frequency.value=fq;
      g.gain.setValueAtTime(0,st);g.gain.linearRampToValueAtTime(vol,st+.02);g.gain.exponentialRampToValueAtTime(.0008,st+1.1);
      o.connect(g);g.connect(a.destination);o.start(st);o.stop(st+1.15);
    });
  });
}
function notifyDone(title,body,kind='focus'){
  try{navigator.vibrate&&navigator.vibrate(kind==='focus'?[250,120,250,120,400]:[200,100,200])}catch(e){}
  chime(kind);
  if(!(S.prefs.notify&&'Notification' in window&&Notification.permission==='granted'))return;
  const o={body,icon:'icon.svg',tag:'tempo-done'};
  if(navigator.serviceWorker&&navigator.serviceWorker.ready)navigator.serviceWorker.ready.then(r=>r.showNotification(title,o)).catch(()=>{try{new Notification(title,o)}catch(e){}});
  else try{new Notification(title,o)}catch(e){}
}

document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act],[data-edit],[data-dur],[data-mode],[data-tab]');if(!t)return;
  if(t.dataset.tab&&!t.closest('#tabs')){tab=t.dataset.tab;render();window.scrollTo(0,0);return}
  if(t.dataset.edit){openSession(S.sessions.find(s=>s.id===t.dataset.edit));return}
  if(t.dataset.dur){if(S.timer.status==='idle'){const s=+t.dataset.dur*60;S.timer.dur=s;S.timer.remaining=s;S.timer.pendingBreak=0;save();render()}return}
  if(t.dataset.mode){statMode=t.dataset.mode;render();return}
  if(t.dataset.act==='copysum'){copyText(summaryText(summaryData()));return}
  if(t.dataset.act==='goals')openGoals();
  if(t.dataset.act==='toggle'){ac();toggle()}
  if(t.dataset.act==='startbreak'){ac();startBreak(S.timer.pendingBreak)}
  if(t.dataset.act==='skip')skipBreak();
  if(t.dataset.act==='finish')finish(true);
});
document.addEventListener('input',e=>{

  else if(e.target.id==='tNote')S.timer.note=e.target.value;
  else if(e.target.id==='fText'){fText=e.target.value;const p=e.target.selectionStart;render();const i=$('#fText');i.focus();i.setSelectionRange(p,p);return}

/* ---------- timer ---------- */
function remaining(){const t=S.timer;return t.status==='running'?Math.max(0,Math.round((t.endAt-Date.now())/1000)):t.remaining}
let lastLit=-1;
function tick(){
  const t=S.timer;if(!$('#clock'))return;
  const r=remaining();
  if(t.status==='running'&&r<=0){complete();return}
  $('#clock').textContent=`${pad(Math.floor(r/60))}:${pad(r%60)}`;
  const p=t.status==='idle'?0:Math.min(1,Math.max(0,1-r/t.dur));
  const pg=$('#pg');if(pg){pg.style.strokeDashoffset=590.62*p;pg.style.opacity=t.status==='idle'?.35:1}
  const kn=$('#kn');if(kn)kn.setAttribute('transform',`rotate(${(p*360).toFixed(2)} 110 110)`);
  const lit=Math.floor(p*60);
  if(lit!==lastLit){lastLit=lit;document.querySelectorAll('#tks .tk').forEach((l,i)=>l.classList.toggle('lit',i<lit))}
  const cs=$('#csub');if(cs)cs.textContent=t.status==='running'?'Termina a las '+new Date(t.endAt).toLocaleTimeString('es-DO',{hour:'numeric',minute:'2-digit'}):t.status==='paused'?'En pausa':'Listo para empezar';
  const tm=document.querySelector('.timer');if(tm)tm.classList.toggle('live',t.status==='running');
  document.title=t.status==='idle'?'Tempo · Tu tiempo, con intención':`${$('#clock').textContent} · ${t.mode==='break'?'Pausa':'Tempo'}`;
}
function toggle(){
  const t=S.timer;
  if(t.status==='running'){t.remaining=remaining();t.status='paused'}
  else{if(t.status==='idle'){t.title=t.title||'';t.pendingBreak=0}t.endAt=Date.now()+t.remaining*1000;t.status='running'}
  save();render();
}
function record(min,note){
  const t=S.timer,c=cat(t.cat);
  const s={id:'s'+Date.now().toString(36),title:t.title.trim()||(t.cat==='proyectos'?PJ[t.proj||rtTodayId()].name:c.name),cat:t.cat,min,start:new Date().toISOString(),conc:0,proj:t.cat==='proyectos'?(t.proj||rtTodayId()):'',note:(note??t.note).trim()};
  S.sessions.push(s);return s;
}
function focusDur(){const k=S.timer;return k.mode==='break'?(k.focusDur||1500):k.dur}
function reset(){const k=S.timer,d=focusDur();S.timer={...idle(),cat:k.cat,proj:k.proj,dur:d,remaining:d}}
function startBreak(min){
  const k=S.timer,fd=focusDur(),sec=min*60;
  S.timer={...idle(),cat:k.cat,mode:'break',focusDur:fd,dur:sec,remaining:sec,endAt:Date.now()+sec*1000,status:'running'};
  save();render();
}
function skipBreak(){reset();save();render()}
function complete(){
  const t=S.timer;
  if(t.mode==='break'){
    notifyDone('Pausa terminada','Listo para otra sesión de enfoque.','rest');
    reset();save();render();return;
  }
  const s=record(Math.round(t.dur/60)),bm=breakMin(t.dur);
  notifyDone('Sesión completada','Has enfocado '+Math.round(t.dur/60)+' min en '+(s.title||'tu tarea')+'. Toca descansar '+bm+' min.','focus');
  reset();
  if(S.prefs.autoBreak)startBreak(bm);else S.timer.pendingBreak=bm;
  save();render();openSession(s,true);
}
function finish(manual){
  const t=S.timer,done=Math.floor((t.dur-remaining())/60);
  if(done<1){toast('Necesitas al menos 1 minuto para guardar.');return}
  const s=record(done);reset();save();render();openSession(s,true);
}

function openGoals(){

  ${CATS.map(c=>`<div class="goalrow"><span><i class="dot" style="background:${c.color}"></i> ${c.name}</span><input class="in" type="number" min="0" max="80" step="0.5" data-g="${c.id}" value="${(S.goals[c.id]||0)/60}"><span class="sub">h / sem</span></div>`).join('')}
  <div class="mfoot"><button class="btn pri" id="gSave">${svg('check')}Guardar metas</button></div>`);
  $('#mx').onclick=closeModal;
  $('#gSave').onclick=()=>{const g={};document.querySelectorAll('[data-g]').forEach(i=>{const v=Math.round((parseFloat(i.value)||0)*60);if(v>0)g[i.dataset.g]=v});S.goals=g;save();closeModal();render()};
}

/* ---------- backup ---------- */
function abkLabel(){const b=$('#abk');if(b)b.textContent='Pausa automática: '+(S.prefs.autoBreak?'sí':'no')}
$('#abk').onclick=()=>{S.prefs.autoBreak=!S.prefs.autoBreak;save();abkLabel();toast(S.prefs.autoBreak?'La pausa empezará sola':'La pausa la inicias tú');if(tab==='enfoque')render()};
$('#snd').onclick=()=>{ac();chime('focus');toast('Así suena al terminar')};
$('#ntf').onclick=async()=>{
  if(!('Notification' in window)){toast('Este navegador no soporta avisos.');return}
  if(S.prefs.notify){S.prefs.notify=false;save();ntfLabel();toast('Avisos desactivados');return}
  const p=Notification.permission==='granted'?'granted':await Notification.requestPermission();
  if(p==='granted'){S.prefs.notify=true;save();ntfLabel();toast('Avisos activados');notifyDone('Tempo','Los avisos funcionan.')}
  else toast('Permiso de avisos denegado.');
};
$('#exp').onclick=()=>{
  const b=new Blob([JSON.stringify({app:'tempo',v:3,sessions:S.sessions,goals:S.goals},null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=`tempo-${dkey(new Date())}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
};
$('#imp').onclick=()=>$('#file').click();
$('#file').onchange=async e=>{
  const f=e.target.files[0];if(!f)return;
  try{
    const d=JSON.parse(await f.text());
    if(d.app!=='tempo'||!Array.isArray(d.sessions)||d.sessions.some(s=>!s||!s.start||isNaN(pd(s.start))||!(s.min>0)))throw 0;
    if(!confirm(`Esto reemplazará tus ${S.sessions.length} sesiones actuales por ${d.sessions.length}. ¿Continuar?`))return;
    S.sessions=d.sessions.map(s=>({id:s.id||'s'+Math.random().toString(36).slice(2),title:s.title||'',cat:s.cat||'otros',min:+s.min,start:s.start,conc:+s.conc||0,proj:s.proj||'',note:s.note||''}));
    if(d.goals&&typeof d.goals==='object')S.goals=d.goals;
    migrate(S);
    save();render();toast('Datos importados');
  }catch(_){toast('Archivo no válido. No se cambió nada.')}
  e.target.value='';
};

/* ---------- boot ---------- */
(function boot(){
  const t=S.timer;
  if(t.status==='running'&&t.endAt<=Date.now()){if(t.mode==='break'){reset();save();render()}else{const s=record(Math.round(t.dur/60));reset();S.timer.pendingBreak=breakMin(t.dur);save();render();openSession(s,true)}}
  else render();
  save();ntfLabel();abkLabel();
  if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
</script>
</body>
